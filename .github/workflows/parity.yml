name: Parity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint:render
      - run: bun run render:catalog
      - run: bun run test:parity
      - run: bun run test:matrix
      - run: bun run test:campaign
